<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>孟德尔-哥德尔机 MGM</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#273330;background:#F4F7F5}
.boot{width:min(680px,86vw);padding:34px 38px;background:#fff;border:1px solid rgba(39,51,48,.12);box-shadow:0 18px 60px rgba(39,51,48,.08)}
h1{margin:0 0 12px;font-size:26px;line-height:1.25}p{margin:0;color:#6B7A72;line-height:1.7;font-size:15px}
</style>
</head>
<body>
<div class="boot"><h1>正在加载 MGM 汇报</h1><p>正在载入完整汇报并加入 Discussion 部分。</p></div>
<script>
(async()=>{
  const [baseResp,extResp]=await Promise.all([
    fetch('index.base.zh.html',{cache:'no-cache'}),
    fetch('index.discussion.zh.html',{cache:'no-cache'})
  ]);
  if(!baseResp.ok) throw new Error(`无法读取基础 deck: ${baseResp.status}`);
  if(!extResp.ok) throw new Error(`无法读取 Discussion: ${extResp.status}`);
  const [baseHtml,extSource]=await Promise.all([baseResp.text(),extResp.text()]);
  const doc=new DOMParser().parseFromString(baseHtml,'text/html');

  const cssMatch=extSource.match(/style\.textContent \+= `([\s\S]*?)`;\s*\n\s*}/);
  if(cssMatch){
    const style=doc.querySelector('style');
    if(style) style.textContent+='\n'+cssMatch[1];
  }

  const slidesMatch=extSource.match(/const discussionSlides = `([\s\S]*?)`;\s*\n\s*const anchor/);
  if(!slidesMatch) throw new Error('无法解析 Discussion slides');
  const anchor=doc.querySelector('[data-slide-id="additive-landscape"]');
  if(!anchor) throw new Error('未找到理论部分插入点');
  anchor.insertAdjacentHTML('beforebegin',slidesMatch[1]);

  const slides=Array.from(doc.querySelectorAll('.slide'));
  slides.forEach((slide,idx)=>{
    slide.setAttribute('data-slide',String(idx));
    const kicker=slide.querySelector('.section-kicker');
    if(kicker) kicker.textContent=kicker.textContent.replace(/\d+\s*$/,String(idx));
  });

  document.open();
  document.write('<!DOCTYPE html>\n'+doc.documentElement.outerHTML);
  document.close();
})().catch(err=>{
  document.body.innerHTML=`<div class="boot"><h1>加载失败</h1><p>${err.message}</p></div>`;
});
</script>
</body>
</html>
